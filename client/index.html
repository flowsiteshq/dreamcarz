<!doctype html>
<html lang="en">

  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>DreamCarz Network — Drive Your Dream Car</title>
   <link rel="icon" type="image/x-icon" href="/favicon.ico" />
   <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
   <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192x192.png" />
   <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="description" content="DreamCarz Network — Premium automotive membership. Drive luxury and value vehicles while earning DCP Transportation Purchasing Power." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      .dreamcarz-boot {
        box-sizing: border-box;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f7f1e9;
        color: #111111;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .dreamcarz-boot__panel { width: min(100%, 360px); text-align: center; }
      .dreamcarz-boot__mark {
        display: inline-grid;
        width: 52px;
        height: 52px;
        place-items: center;
        border: 1px solid #d9c28e;
        border-radius: 999px;
        background: #ffffff;
        color: #a98331;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: -0.08em;
      }
      .dreamcarz-boot__eyebrow { margin: 22px 0 0; color: #a98331; font-size: 10px; font-weight: 700; letter-spacing: 0.22em; text-transform: uppercase; }
      .dreamcarz-boot__title { margin: 9px 0 0; font-family: Syne, Inter, sans-serif; font-size: 30px; font-weight: 700; letter-spacing: -0.05em; }
      .dreamcarz-boot__copy { margin: 10px 0 0; color: #5d584f; font-size: 14px; line-height: 1.5; }
      .dreamcarz-boot__progress { width: 112px; height: 3px; margin: 24px auto 0; overflow: hidden; border-radius: 999px; background: #e5dccb; }
      .dreamcarz-boot__progress::after { display: block; width: 46%; height: 100%; border-radius: inherit; background: #a98331; content: ""; animation: dreamcarz-boot-progress 1.2s ease-in-out infinite alternate; }
      @keyframes dreamcarz-boot-progress { from { transform: translateX(-35%); } to { transform: translateX(150%); } }
      @media (prefers-reduced-motion: reduce) { .dreamcarz-boot__progress::after { animation: none; transform: translateX(60%); } }
    </style>
    <script type="text/javascript">
      window.adroll_adv_id = "PRESWOSMZRACVEOTTZVKK3";
      window.adroll_pix_id = "VPYTI7B2RJDGZMI4IQZ2V4";
      window.adroll_version = "2.0";
      (function (w, d, e, o, a) {
        w.__adroll_loaded = true;
        w.adroll = w.adroll || [];
        w.adroll.f = ["setProperties", "identify", "track"];
        var roundtripUrl = "https://s.adroll.com/j/" + w.adroll_adv_id + "/roundtrip.js";
        for (a = 0; a < w.adroll.f.length; a++) {
          w.adroll[w.adroll.f[a]] = w.adroll[w.adroll.f[a]] || (function (name) {
            return function () { w.adroll.push([name, arguments]); };
          })(w.adroll.f[a]);
        }
        e = d.createElement("script");
        o = d.getElementsByTagName("script")[0];
        e.async = true;
        e.src = roundtripUrl;
        o.parentNode.insertBefore(e, o);
      })(window, document);
      window.adroll.track("pageView");
    </script>
  </head>

  <body>
    <div id="root">
      <div class="dreamcarz-boot" role="status" aria-live="polite" aria-label="Loading DreamCarz">
        <div class="dreamcarz-boot__panel">
          <div class="dreamcarz-boot__mark" aria-hidden="true">DC</div>
          <p class="dreamcarz-boot__eyebrow">DreamCarz</p>
          <p class="dreamcarz-boot__title">Preparing your drive.</p>
          <p class="dreamcarz-boot__copy">Loading the DreamCarz experience…</p>
          <div class="dreamcarz-boot__progress" aria-hidden="true"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script
      defer
      src="%VITE_ANALYTICS_ENDPOINT%/umami"
      data-website-id="%VITE_ANALYTICS_WEBSITE_ID%"></script>
  </body>

</html>
